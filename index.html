<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      ========================================================================
      PRINT-SATHI: HTML5 Document Shell (index.html)
      ========================================================================
      What this file does in plain language:
      - Sets up browser metadata (UTF-8 character set, responsive viewport).
      - Pre-loads modern, high-contrast campus typography:
        * 'Plus Jakarta Sans' for clean, readable interface labels and cards.
        * 'JetBrains Mono' for crisp tabular prices, page counts, and tokens.
      - Provides the single container (<div id="root">) where React renders the app.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print-Sathi | Campus Smart Print Queue</title>
    
    <!-- Google Fonts for crisp modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- The Root DOM element mounted by React -->
    <div id="root"></div>

    <!-- React Application Entrypoint -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
